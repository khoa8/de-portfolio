x-phase07-airflow-env: &phase07-airflow-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_CDC_TOPIC: ${KAFKA_CDC_TOPIC:-phase07.phase07_shop.orders}
  PHASE07_CHECKPOINT_LOCATION: ${PHASE07_CHECKPOINT_LOCATION:-/opt/airflow/checkpoints/mysql_orders}

x-phase07-airflow-volumes: &phase07-airflow-volumes
  - phase07_spark_checkpoints:/opt/airflow/checkpoints

services:
  airflow-scheduler:
    environment:
      <<: *phase07-airflow-env
    volumes: *phase07-airflow-volumes

  airflow-dag-processor:
    environment:
      <<: *phase07-airflow-env

  mysql:
    image: mysql:8.4.6
    profiles: [phase07]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CDC_ROOT_PASSWORD:?Set MYSQL_CDC_ROOT_PASSWORD in airflow/.env}
      MYSQL_DATABASE: ${MYSQL_CDC_DATABASE:-phase07_shop}
      TZ: UTC
    command:
      - --server-id=184054
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
    ports:
      - "127.0.0.1:${MYSQL_CDC_HOST_PORT:-3307}:3306"
    volumes:
      - phase07_mysql_data:/var/lib/mysql
      - ../sql/phase07/001_mysql_source.sql:/docker-entrypoint-initdb.d/001_mysql_source.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - de_network

  phase07-mysql-init:
    image: mysql:8.4.6
    profiles: [phase07]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CDC_ROOT_PASSWORD:?Set MYSQL_CDC_ROOT_PASSWORD in airflow/.env}
      MYSQL_CDC_PASSWORD: ${MYSQL_CDC_PASSWORD:?Set MYSQL_CDC_PASSWORD in airflow/.env}
      MYSQL_CDC_DATABASE: ${MYSQL_CDC_DATABASE:-phase07_shop}
    entrypoint: ["bash", "/phase07-scripts/phase07_init_mysql.sh"]
    volumes:
      - ../sql/phase07:/phase07:ro
      - ./scripts:/phase07-scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - de_network

  kafka:
    image: apache/kafka:3.9.1
    profiles: [phase07]
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - phase07_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - de_network

  phase07-kafka-init:
    image: apache/kafka:3.9.1
    profiles: [phase07]
    entrypoint: ["bash", "/phase07/phase07_init_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CDC_TOPIC: ${KAFKA_CDC_TOPIC:-phase07.phase07_shop.orders}
    volumes:
      - ./scripts:/phase07:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - de_network

  connect:
    image: quay.io/debezium/connect:3.2.4.Final
    profiles: [phase07]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: phase07-connect
      CONFIG_STORAGE_TOPIC: phase07_connect_configs
      OFFSET_STORAGE_TOPIC: phase07_connect_offsets
      STATUS_STORAGE_TOPIC: phase07_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: connect
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      phase07-kafka-init:
        condition: service_completed_successfully
      phase07-mysql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - de_network

  phase07-connect-bootstrap:
    image: ${AIRFLOW_IMAGE_NAME:-de-airflow:3.0.4}
    profiles: [phase07]
    entrypoint: ["python", "/phase07/phase07_bootstrap_connector.py"]
    environment:
      KAFKA_CONNECT_URL: ${KAFKA_CONNECT_URL:-http://connect:8083}
      MYSQL_CDC_PASSWORD: ${MYSQL_CDC_PASSWORD:?Set MYSQL_CDC_PASSWORD in airflow/.env}
      MYSQL_CDC_DATABASE: ${MYSQL_CDC_DATABASE:-phase07_shop}
    volumes:
      - ./scripts:/phase07:ro
    depends_on:
      connect:
        condition: service_healthy
    restart: "no"
    networks:
      - de_network

  phase07-sink-init:
    image: postgres:16
    profiles: [phase07]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in airflow/.env}
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER}
      - --dbname=ecom_dw
      - --set=ON_ERROR_STOP=1
      - --file=/phase07/002_postgres_sink.sql
    volumes:
      - ../sql/phase07:/phase07:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - de_network

  phase07-checkpoint-init:
    image: ${AIRFLOW_IMAGE_NAME:-de-airflow:3.0.4}
    profiles: [phase07]
    user: "0:0"
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        install -d -o "${AIRFLOW_UID:-50000}" -g 0 -m 0770
        /opt/airflow/checkpoints/mysql_orders
    volumes:
      - phase07_spark_checkpoints:/opt/airflow/checkpoints
    restart: "no"
    networks:
      - de_network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [phase07]
    environment:
      KAFKA_CLUSTERS_0_NAME: phase07-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: phase07-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      connect:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - de_network

  phase07-spark:
    image: ${AIRFLOW_IMAGE_NAME:-de-airflow:3.0.4}
    profiles: [phase07-demo]
    entrypoint: ["spark-submit"]
    command:
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/home/airflow/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - --jars
      - /opt/airflow/jars/postgresql-42.7.7.jar
      - /opt/airflow/spark/mysql_cdc_to_postgres.py
      - --trigger
      - processingTime
      - --processing-time
      - 5 seconds
      - --checkpoint-location
      - ${PHASE07_CHECKPOINT_LOCATION:-/opt/airflow/checkpoints/mysql_orders}
    environment:
      <<: *phase07-airflow-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ecom_dw
    volumes:
      - ../spark:/opt/airflow/spark:ro
      - phase07_spark_checkpoints:/opt/airflow/checkpoints
    networks:
      - de_network

volumes:
  phase07_mysql_data:
  phase07_kafka_data:
  phase07_spark_checkpoints:
