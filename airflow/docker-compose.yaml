x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-de-airflow:3.0.4}
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_UI_USERNAME:-airflow}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated
    AIRFLOW__CORE__FERNET_KEY_CMD: cat /opt/airflow/auth/fernet_key
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__DAG_IGNORE_FILE_SYNTAX: glob
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /opt/airflow/auth/jwt_secret
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_PG_DW: >-
      {"conn_type":"postgres","host":"postgres","port":5432,"login":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}","schema":"ecom_dw"}
    AIRFLOW_CONN_SPARK_LOCAL: >-
      {"conn_type":"spark","host":"local[*]"}
    MSSQL_HOST: ${MSSQL_HOST:-}
    MSSQL_PORT: ${MSSQL_PORT:-1433}
    MSSQL_DATABASE: ${MSSQL_DATABASE:-EDW_Tech}
    MSSQL_USER: ${MSSQL_USER:-}
    MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
    MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-true}
    MSSQL_TRUST_SERVER_CERTIFICATE: ${MSSQL_TRUST_SERVER_CERTIFICATE:-false}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config:ro
    - ./plugins:/opt/airflow/plugins:ro
    - ./data:/opt/airflow/data:ro
    - ../spark:/opt/airflow/spark:ro
    - ../sql:/opt/airflow/sql:ro
    - airflow_auth:/opt/airflow/auth
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - de_network

services:
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        umask 077
        if [ ! -s /opt/airflow/auth/jwt_secret ]; then
          python -c "import secrets; print(secrets.token_urlsafe(48))" > /opt/airflow/auth/jwt_secret
        fi
        if [ ! -s /opt/airflow/auth/fernet_key ]; then
          python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > /opt/airflow/auth/fernet_key
        fi
        if [ ! -e /opt/airflow/auth/simple_auth_manager_passwords.json.generated ]; then
          printf '{}\n' > /opt/airflow/auth/simple_auth_manager_passwords.json.generated
        fi
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/auth
        chmod 600 /opt/airflow/auth/jwt_secret /opt/airflow/auth/fernet_key /opt/airflow/auth/simple_auth_manager_passwords.json.generated
        runuser -u airflow -- airflow db migrate
        runuser -u airflow -- airflow version
    restart: "no"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    entrypoint: airflow
    command: version

volumes:
  airflow_auth:
